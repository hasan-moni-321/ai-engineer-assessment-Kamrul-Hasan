services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-assessment-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ai-assessment-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data:ro
    command:
      [
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: ai-assessment-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  qdrant_data:
