[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-assessment"
version = "1.0.0"
description = "Production-oriented FastAPI RAG chatbot with Flask frontend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "openai>=1.70,<3.0",
  "qdrant-client>=1.13,<2.0",
  "PyMuPDF>=1.25,<2.0",
  "tiktoken>=0.9,<1.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9,<10",
  "structlog>=25,<26",
  "Flask>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
